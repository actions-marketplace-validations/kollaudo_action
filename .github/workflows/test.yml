name: Test

# Runs the actions against Kollaudo itself (ADR 0020): its image, the release the actions pin, next to
# PostgreSQL. push sends the results the gate then judges, and the last step checks what each did.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kollaudo
          POSTGRES_PASSWORD: kollaudo
          POSTGRES_DB: kollaudo
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kollaudo" --health-interval 2s --health-retries 30
    env:
      KOLLAUDO_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Start Kollaudo, at the release the actions run
        run: |
          version=$(sed -n 's/^ *KOLLAUDO_CLI_VERSION: //p' action.yml)
          push_version=$(sed -n 's/^ *KOLLAUDO_CLI_VERSION: //p' push/action.yml)
          if [[ $version != "$push_version" ]]; then
            echo "::error::The gate runs CLI $version, push runs $push_version: they must be the same release."
            exit 1
          fi
          docker run -d --name kollaudo --network host \
            -e DATABASE_URL=postgres://kollaudo:kollaudo@localhost:5432/kollaudo \
            "ghcr.io/kollaudo/kollaudo:$version"
          for _ in $(seq 60); do curl -fsS "$KOLLAUDO_URL/readyz" && break; sleep 1; done
          tokens=$(docker exec kollaudo kollaudo-server project create action)
          for scope in ingest read; do
            token=$(awk -v s="$scope" '$1 == s { print $2 }' <<<"$tokens")
            echo "::add-mask::$token"
            echo "${scope^^}_TOKEN=$token" >>"$GITHUB_ENV"
          done

      - name: Write reports
        run: |
          report() {
            printf '{"results":{"tool":{"name":"playwright"},"summary":{"tests":1},"tests":[{"name":"home","status":"%s","duration":10}]}}' "$1"
          }
          report passed >passed.json
          report failed >failed.json
          mkdir -p junit
          printf '<testsuite name="unit"><testcase classname="cart" name="adds"/><testcase classname="cart" name="pays"/></testsuite>' >junit/cart.xml
          printf '<testsuite name="unit"><testcase classname="search" name="finds"/></testsuite>' >junit/search.xml

      - name: "push: a passed run of e2e tests in staging"
        id: push-passed
        uses: ./push
        with: { url: "${{ env.KOLLAUDO_URL }}", token: "${{ env.INGEST_TOKEN }}", path: passed.json, component: api, environment: staging, version: 1.0.0 }

      - name: "push: a failed run, which is still sent"
        id: push-failed
        uses: ./push
        with: { url: "${{ env.KOLLAUDO_URL }}", token: "${{ env.INGEST_TOKEN }}", path: failed.json, component: api, environment: staging, version: 2.0.0 }

      - name: "push: JUnit files by glob pattern, at build level"
        id: push-junit
        uses: ./push
        with: { url: "${{ env.KOLLAUDO_URL }}", token: "${{ env.INGEST_TOKEN }}", path: "junit/*.xml", component: api, kind: unit, tool: vitest, version: 1.0.0 }

      - name: "push: with a read token, refused"
        id: push-refused
        continue-on-error: true
        uses: ./push
        with: { url: "${{ env.KOLLAUDO_URL }}", token: "${{ env.READ_TOKEN }}", path: passed.json, component: api, environment: staging, version: 1.0.0 }

      - name: "pass: goes on"
        id: pass
        uses: ./
        with: { url: "${{ env.KOLLAUDO_URL }}", token: "${{ env.READ_TOKEN }}", component: api, environment: staging, version: 1.0.0 }

      - name: "fail: stops"
        id: fail
        continue-on-error: true
        uses: ./
        with: { url: "${{ env.KOLLAUDO_URL }}", token: "${{ env.READ_TOKEN }}", component: api, environment: staging, version: 2.0.0 }

      - name: "unknown, as no test ran: stops"
        id: unknown
        continue-on-error: true
        uses: ./
        with: { url: "${{ env.KOLLAUDO_URL }}", token: "${{ env.READ_TOKEN }}", component: api, environment: staging, version: 3.0.0 }

      - name: "unknown, as a required kind never ran: stops"
        id: required
        continue-on-error: true
        uses: ./
        with: { url: "${{ env.KOLLAUDO_URL }}", token: "${{ env.READ_TOKEN }}", component: api, environment: staging, version: 1.0.0, require: "e2e,smoke" }

      - name: "unknown with allow: unknown: goes on"
        id: allowed
        uses: ./
        with: { url: "${{ env.KOLLAUDO_URL }}", token: "${{ env.READ_TOKEN }}", component: api, environment: staging, version: 3.0.0, allow: unknown }

      - name: "no answer: stops"
        id: down
        continue-on-error: true
        uses: ./
        with: { url: "http://localhost:9", token: "${{ env.READ_TOKEN }}", component: api, environment: staging, version: 1.0.0, allow: unknown }

      - name: "no answer with allow: no-verdict: goes on"
        id: down-allowed
        uses: ./
        with: { url: "http://localhost:9", token: "${{ env.READ_TOKEN }}", component: api, environment: staging, version: 1.0.0, allow: no-verdict }

      - name: "a typo in allow: stops"
        id: typo
        continue-on-error: true
        uses: ./
        with: { url: "${{ env.KOLLAUDO_URL }}", token: "${{ env.READ_TOKEN }}", component: api, environment: staging, version: 3.0.0, allow: unknwon }

      - name: Check what the actions did
        env:
          RESULTS: >-
            push-passed success -,
            push-failed success -,
            push-junit success -,
            push-refused failure -,
            pass success pass,
            fail failure fail,
            unknown failure unknown,
            required failure unknown,
            allowed success unknown,
            down failure no-verdict,
            down-allowed success no-verdict,
            typo failure -
          STEPS: ${{ toJSON(steps) }}
        run: |
          status=0
          IFS=',' read -ra cases <<<"$RESULTS"
          for case in "${cases[@]}"; do
            read -r id want_step want_outcome <<<"$case"
            got_step=$(jq -r --arg id "$id" '.[$id].outcome' <<<"$STEPS")
            # An output the step never set is empty: shown as "-". push has no outcome, but a link.
            got_outcome=$(jq -r --arg id "$id" '.[$id].outputs.outcome | if . == null or . == "" then "-" else . end' <<<"$STEPS")
            if [[ $got_step == "$want_step" && $got_outcome == "$want_outcome" ]]; then
              echo "✓ $id: $got_step, $got_outcome"
            else
              echo "✗ $id: $got_step, $got_outcome; expected $want_step, $want_outcome"
              status=1
            fi
          done
          # A push that stored its results gives the link to the test run in Kollaudo.
          for id in push-passed push-failed push-junit; do
            link=$(jq -r --arg id "$id" '.[$id].outputs["test-run-url"] // ""' <<<"$STEPS")
            if [[ $link == "$KOLLAUDO_URL"/test-runs/* ]]; then
              echo "✓ $id: $link"
            else
              echo "✗ $id: no link to the test run, got \"$link\""
              status=1
            fi
          done
          exit "$status"
